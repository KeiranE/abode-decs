name: Restore and gently AI-enhance original Abode service photos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upscale-service-images.yml'
permissions:
  contents: write
jobs:
  restore-enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing libraries
        run: pip install opencv-contrib-python-headless==4.10.0.84 numpy==1.26.4 pillow
      - name: Restore original photos and apply gentle AI super-resolution
        run: |
          python - <<'PY'
          import subprocess, urllib.request
          import cv2
          import numpy as np
          from pathlib import Path
          from PIL import Image
          # Original files are taken from the commit before the earlier AI upscaling,
          # not from the previously processed images.
          original_commit='1c4e63052baabfec0c39de1985d28531045707cd'
          model='https://raw.githubusercontent.com/Saafke/FSRCNN_Tensorflow/master/models/FSRCNN_x3.pb'
          urllib.request.urlretrieve(model,'/tmp/FSRCNN_x3.pb')
          sr=cv2.dnn_superres.DnnSuperResImpl_create()
          sr.readModel('/tmp/FSRCNN_x3.pb')
          sr.setModel('fsrcnn',3)
          names=['work-staircase-teal.webp','image-1.webp','image-6.webp','image-13.webp']
          for name in names:
              path=Path('assets')/name
              original_bytes=subprocess.check_output(['git','show',f'{original_commit}:{path}'])
              original=cv2.imdecode(np.frombuffer(original_bytes,dtype=np.uint8),cv2.IMREAD_COLOR)
              if original is None: raise RuntimeError(f'Unable to read original {path}')
              h,w=original.shape[:2]
              target=(round(w*1.5),round(h*1.5))
              # Use a trained neural upscaler, then blend it with a clean
              # interpolation of the untouched original to prevent invented detail.
              neural=cv2.resize(sr.upsample(original),target,interpolation=cv2.INTER_AREA)
              faithful=cv2.resize(original,target,interpolation=cv2.INTER_CUBIC)
              result=cv2.addWeighted(faithful,0.68,neural,0.32,0)
              # Light luminance-only sharpening, avoiding artificial halos.
              lab=cv2.cvtColor(result,cv2.COLOR_BGR2LAB)
              l,a,b=cv2.split(lab)
              blur=cv2.GaussianBlur(l,(0,0),0.7)
              l=cv2.addWeighted(l,1.12,blur,-0.12,0)
              result=cv2.cvtColor(cv2.merge((l,a,b)),cv2.COLOR_LAB2BGR)
              rgb=cv2.cvtColor(result,cv2.COLOR_BGR2RGB)
              Image.fromarray(rgb).save(path,'WEBP',quality=94,method=6)
              print(f'Restored and subtly AI enhanced {path}: {w}x{h} -> {target[0]}x{target[1]}')
          PY
      - name: Commit original-based enhanced photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/work-staircase-teal.webp assets/image-1.webp assets/image-6.webp assets/image-13.webp
          git diff --cached --quiet || (git commit -m "Restore original photos with subtle AI enhancement" && git push)
