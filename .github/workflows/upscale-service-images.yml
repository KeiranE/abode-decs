name: AI upscale Abode service images
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/upscale-service-images.yml'
permissions:
  contents: write
jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AI upscaler
        run: pip install opencv-contrib-python-headless==4.10.0.84 numpy==1.26.4 pillow
      - name: AI super-resolution of the four original photos
        run: |
          python - <<'PY'
          import cv2, urllib.request
          from PIL import Image, ImageFilter
          from pathlib import Path
          model='https://raw.githubusercontent.com/Saafke/FSRCNN_Tensorflow/master/models/FSRCNN_x3.pb'
          urllib.request.urlretrieve(model,'/tmp/FSRCNN_x3.pb')
          sr=cv2.dnn_superres.DnnSuperResImpl_create()
          sr.readModel('/tmp/FSRCNN_x3.pb')
          sr.setModel('fsrcnn',3)
          names=['work-staircase-teal.webp','image-1.webp','image-6.webp','image-13.webp']
          for name in names:
              p=Path('assets')/name
              original=cv2.imread(str(p),cv2.IMREAD_COLOR)
              if original is None: raise RuntimeError(f'Cannot read {p}')
              h,w=original.shape[:2]
              # Neural-network super-resolution, then a restrained 2x master.
              upscaled=sr.upsample(original)
              upscaled=cv2.resize(upscaled,(w*2,h*2),interpolation=cv2.INTER_AREA)
              rgb=cv2.cvtColor(upscaled,cv2.COLOR_BGR2RGB)
              result=Image.fromarray(rgb).filter(ImageFilter.UnsharpMask(radius=1.0,percent=55,threshold=3))
              result.save(p,'WEBP',quality=92,method=6)
              print(f'AI upscaled {p}: {w}x{h} -> {w*2}x{h*2}')
          PY
      - name: Remove ineffective browser sharpening filter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.find('<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;overflow:hidden"><filter id="abode-service-detail"')
          if start!=-1:
              end=s.index('</svg>',start)+len('</svg>')
              s=s[:start]+s[end:]
              p.write_text(s)
          p=Path('assets/style.css')
          s=p.read_text()
          s=s.replace('filter:url("#abode-service-detail");','filter:none;')
          p.write_text(s)
          PY
      - name: Commit upscaled images and deploy via Vercel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/work-staircase-teal.webp assets/image-1.webp assets/image-6.webp assets/image-13.webp assets/style.css index.html
          git diff --cached --quiet || (git commit -m "AI upscale four service panel photographs" && git push)
